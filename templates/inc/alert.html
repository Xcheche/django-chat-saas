{% if messages %}
  {% for message in messages %}
    <div class="alert-container">
      <div class="message message-{{ message.level_tag }}">
        {{ message }}
      </div>
    </div>
  {% endfor %}
{% endif %}

<style>
.alert-container {
  display: flex;
  justify-content: center;
  padding: 10px 15px;
}

/* Success message */
.message-success {
  background-color: #4CAF50;
  color: white;
  border-left: 5px solid #388E3C;
}

/* Error message */
.message-error {
  background-color: #f44336;
  color: white;
  border-left: 5px solid #D32F2F;
}

.message-info {
  background-color: #d9edf7;
  color: #31708f;
  border-left: 5px solid #5bc0de;
}

.message-warning {
  background-color: #fcf8e3;
  color: #8a6d3b;
  border-left: 5px solid #f0ad4e;
}

/* Style for the message text */
.message {
  width: fit-content;
  max-width: min(100%, 720px);
  padding: 15px;
  font-size: 16px;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}


/* pagination */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1rem;
  font-family: Arial, sans-serif;
}

.step-links {
  display: flex;
  gap: 1rem;
  align-items: center;
}

.pagination-link {
  text-decoration: none;
  color: #007bff;
  font-weight: bold;
  padding: 0.5rem 1rem;
  border: 1px solid #007bff;
  border-radius: 5px;
  transition: background-color 0.3s, color 0.3s;
}

.pagination-link:hover {
  background-color: #007bff;
  color: #fff;
}

.pagination-disabled {
  color: #aaa;
  padding: 0.5rem 1rem;
  border: 1px solid #ddd;
  border-radius: 5px;
  cursor: not-allowed;
}

.pagination-current {
  font-weight: bold;
  padding: 0.5rem 1rem;
  color: #333;
}


/* Style the error list container */
.errorlist {
  list-style-type: none;
  color: #d9534f;
  font-size: 14px;
  background-color: #f8d7da;
  border: 1px solid #f5c6cb;
  border-radius: 4px;
  padding: 10px;
}

/* Style individual error list items */
.errorlist li {
  margin-bottom: 5px;
  /* Adds spacing between errors */
  color: #d9534f;
}


</style>

<script>
  window.onload = function() {
  const messages = document.querySelectorAll('.message');
  messages.forEach(function(message) {
    setTimeout(function() {
      message.style.opacity = '0';
      setTimeout(function() {
        message.style.display = 'none'; 
      }, 1000); 
    }, 5000);
  });
};
</script>
