
<!doctype html>
{% load static %}
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">

    <!-- Responsive viewport for mobile-friendly layout -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}Auth | Cheche Ai{% endblock %}</title>

    <!-- Bootstrap 5.3 CSS from CDN — no local static build step required -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
    >
</head>

<!--===== SHARED AUTH PAGE STYLES: START =====-->
<style>
  html,
body {
  height: 100%;
}

.form-signin {
  max-width: 330px;
  padding: 1rem;
}

.form-signin .form-floating:focus-within {
  z-index: 2;
}

.form-signin input[type="email"] {
  margin-bottom: -1px;
  border-bottom-right-radius: 0;
  border-bottom-left-radius: 0;
}

.form-signin input[type="password"] {
  margin-bottom: -1px;
  border-top-left-radius: 0;
  border-top-right-radius: 0;
}

/*===== PASSWORD VISIBILITY TOGGLE STYLES: START =====*/
.password-toggle-wrapper {
  position: relative;
}

.password-toggle-wrapper input[type="password"],
.password-toggle-wrapper input[type="text"] {
  padding-right: 3rem;
}

.password-toggle {
  position: absolute;
  top: 50%;
  right: 0.5rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  padding: 0;
  border: 0;
  border-radius: 0.25rem;
  background: transparent;
  color: #000;
  font-family: "Segoe UI Symbol", sans-serif;
  font-size: 0.9rem;
  transform: translateY(-50%);
  cursor: pointer;
}

.password-toggle span {
  color: #000;
  font-size: 0.9rem;
  line-height: 1;
}

.password-toggle:hover,
.password-toggle:focus-visible {
  background: var(--bs-tertiary-bg);
  color: #000;
}
/*===== PASSWORD VISIBILITY TOGGLE STYLES: END =====*/

</style>
<!--===== SHARED AUTH PAGE STYLES: END =====-->

    <!--=== Theme Toggle ===-->
    <div
      class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle"
    >
      <button
        class="btn btn-bd-primary py-2 dropdown-toggle d-flex align-items-center"
        id="bd-theme"
        type="button"
        aria-expanded="false"
        data-bs-toggle="dropdown"
        aria-label="Toggle theme (auto)"
      >
        <svg class="bi theme-icon-active" width="1em" height="1em" aria-hidden="true">
          <use href="#circle-half"></use>
        </svg>
        <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
      </button>
      <ul
        class="dropdown-menu dropdown-menu-end shadow"
        aria-labelledby="bd-theme-text"
      >
        <li>
          <button
            type="button"
            class="dropdown-item d-flex align-items-center"
            data-bs-theme-value="light"
            aria-pressed="false"
          >
            <svg class="bi me-2 opacity-50" width="1em" height="1em" aria-hidden="true">
              <use href="#sun-fill"></use>
            </svg>
            Light
            <svg class="bi ms-auto d-none" width="1em" height="1em" aria-hidden="true">
              <use href="#check2"></use>
            </svg>
          </button>
        </li>
        <li>
          <button
            type="button"
            class="dropdown-item d-flex align-items-center"
            data-bs-theme-value="dark"
            aria-pressed="false"
          >
            <svg class="bi me-2 opacity-50" width="1em" height="1em" aria-hidden="true">
              <use href="#moon-stars-fill"></use>
            </svg>
            Dark
            <svg class="bi ms-auto d-none" width="1em" height="1em" aria-hidden="true">
              <use href="#check2"></use>
            </svg>
          </button>
        </li>
        <li>
          <button
            type="button"
            class="dropdown-item d-flex align-items-center active"
            data-bs-theme-value="auto"
            aria-pressed="true"
          >
            <svg class="bi me-2 opacity-50" width="1em" height="1em" aria-hidden="true">
              <use href="#circle-half"></use>
            </svg>
            Auto
            <svg class="bi ms-auto d-none" width="1em" height="1em" aria-hidden="true">
              <use href="#check2"></use>
            </svg>

      </ul>

    <!--=== Theme Toggle END ===-->

    
    <main class="form-signin w-100 m-auto">
      <!--Django messages -->
      {% if messages %}
        <div class="alert alert-info" role="alert">
          {% for message in messages %}
            <p>{{ message }}</p>
            <br>
          {% endfor %}
        </div>
      {% endif %}
    {% block content %}{% endblock %}
        <p class="mt-4 mb-3 text-body-secondary">&copy; Cheche Ai 2026</p>
    
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JS bundle (includes Popper for dropdowns/collapse) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!--===== SHARED AUTH PAGE JAVASCRIPT: START =====-->
    <script>
      //===== THEME SWITCHING: START =====
      const storedTheme = localStorage.getItem('theme') || 'auto';
      const applyTheme = (theme) => {
        document.documentElement.setAttribute('data-bs-theme', theme);
        localStorage.setItem('theme', theme);

        const buttons = document.querySelectorAll('[data-bs-theme-value]');
        buttons.forEach((button) => {
          const isActive = button.getAttribute('data-bs-theme-value') === theme;
          button.classList.toggle('active', isActive);
          button.setAttribute('aria-pressed', String(isActive));
          const check = button.querySelector('.bi.ms-auto');
          if (check) {
            check.classList.toggle('d-none', !isActive);
          }
        });
      };

      applyTheme(storedTheme);

      document.querySelectorAll('[data-bs-theme-value]').forEach((button) => {
        button.addEventListener('click', () => {
          const selectedTheme = button.getAttribute('data-bs-theme-value');
          applyTheme(selectedTheme);
        });
      });
      //===== THEME SWITCHING: END =====

      //===== PASSWORD VISIBILITY TOGGLE: START =====
      document.querySelectorAll('input[type="password"]').forEach((input) => {
        if (input.parentElement.classList.contains('password-toggle-wrapper')) {
          return;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'password-toggle-wrapper';
        input.parentNode.insertBefore(wrapper, input);
        wrapper.appendChild(input);

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'password-toggle';
        toggle.setAttribute('aria-label', 'Show password');
        toggle.setAttribute('aria-pressed', 'false');
        toggle.innerHTML = '<span aria-hidden="true">&#128065;&#xfe0e;</span>';
        wrapper.appendChild(toggle);

        toggle.addEventListener('click', () => {
          const showingPassword = input.type === 'text';
          input.type = showingPassword ? 'password' : 'text';
          toggle.setAttribute(
            'aria-label',
            showingPassword ? 'Show password' : 'Hide password'
          );
          toggle.setAttribute('aria-pressed', String(!showingPassword));
        });
      });
      //===== PASSWORD VISIBILITY TOGGLE: END =====
    </script>
    <!--===== SHARED AUTH PAGE JAVASCRIPT: END =====-->
  </body>
</html>
