<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Responsive viewport for mobile-friendly layout -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}Fortitech Online Chat{% endblock %}</title>

    <!-- Bootstrap 5.3 CSS from CDN — no local static build step required -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
    >
<!--- Font Awesome icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    >
    {% block extra_head %}{% endblock %}
</head>

<body class="bg-light">

    <!-- ==================== NAVBAR START ==================== -->
    {% include 'inc/navbar/nav.html' %}
    <!-- ===================== NAVBAR END ===================== -->
    {% include "inc/alert.html" %}
    <!-- Main content area — child templates override the content block -->
    <main class="container py-5">
       {% block content %}
       {% endblock %}
    </main>



  <!-----Footer----->

    <!-- jQuery — required for AJAX chat script in index.html -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JS bundle (includes Popper for dropdowns/collapse) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
